<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1a1035">
<title>同页 · 只写我们</title>
<style>
  :root{
    --bg:#1a1035;--bg2:#241648;--card:#2d1b5e;--ink:#f3edff;--sub:#b7a7e0;--line:#4a3485;--accent:#c9a6ff;--gold:#e8d5ff;--stamp:#b06b8a;--stampink:#d98aa8;--mark1:#7b5ce0;--mark2:#c9a6ff;
  }
  [data-theme="pink"]{--bg:#2a1020;--bg2:#3b1630;--card:#521e42;--ink:#ffeef6;--sub:#e3a8c6;--line:#7c3760;--accent:#ffb1d8;--gold:#ffd6e8;--stamp:#c4709a;--stampink:#ff9cc6;--mark1:#e05c9e;--mark2:#ffb1d8;}
  [data-theme="blue"]{--bg:#0e1a2e;--bg2:#16283f;--card:#1e3a5e;--ink:#eef6ff;--sub:#a8c4e3;--line:#38607c;--accent:#9cc8ff;--gold:#d6e8ff;--stamp:#6a8ab0;--stampink:#9cb9ff;--mark1:#5c8fe0;--mark2:#9cc8ff;}
  [data-theme="green"]{--bg:#0f2018;--bg2:#17332a;--card:#1f4636;--ink:#eefbf4;--sub:#a8dcc0;--line:#3a7058;--accent:#8fe0b4;--gold:#d6f5e3;--stamp:#6aa884;--stampink:#8fe0b4;--mark1:#3f9a6e;--mark2:#8fe0b4;}
  [data-theme="warm"]{--bg:#25170e;--bg2:#362214;--card:#4a2e1c;--ink:#fff6ed;--sub:#e3c0a3;--line:#7c5738;--accent:#ffc99c;--gold:#ffe3c9;--stamp:#b0845c;--stampink:#e3a87c;--mark1:#d97e3f;--mark2:#ffc99c;}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    background:radial-gradient(1200px 600px at 80% -10%,var(--mark1) 0%,transparent 60%),radial-gradient(900px 500px at -10% 110%,var(--bg2) 0%,transparent 55%),linear-gradient(160deg,var(--bg),var(--bg2) 70%,var(--bg));
    color:var(--ink);min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:28px 16px 40px;overflow-x:hidden;transition:background .4s ease}
  .wrap{width:100%;max-width:520px}
  header{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}
  .logo{display:flex;align-items:center;gap:10px}
  .mark{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,var(--mark1),var(--mark2));display:grid;place-items:center;font-size:20px}
  .logo h1{font-size:17px;font-weight:700}
  .logo p{font-size:11px;color:var(--sub);margin-top:2px}
  .badge{font-size:11px;color:var(--accent);border:1px solid var(--line);border-radius:20px;padding:4px 10px}
  .cover{background:linear-gradient(180deg,var(--card),var(--bg2));border:1px solid var(--line);border-radius:22px;padding:26px 22px;box-shadow:0 18px 50px rgba(0,0,0,.35)}
  .date-row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
  .date{font-size:13px;color:var(--accent);font-weight:600;letter-spacing:1px}
  .week{font-size:12px;color:var(--sub)}
  .page-title{font-size:24px;font-weight:800;line-height:1.4;margin:16px 0 4px}
  .page-title em{font-style:normal;color:var(--gold)}
  .rule{width:56px;height:3px;border-radius:2px;background:linear-gradient(90deg,var(--mark1),var(--mark2));margin:14px 0}
  .body-text{font-size:15px;line-height:2;color:var(--ink)}
  .hl{color:var(--gold);font-weight:600}
  .sign{margin-top:30px;display:flex;align-items:center;gap:14px}
  .sign .line{flex:1;height:1px;background:var(--line)}
  .names{display:flex;flex-direction:column;align-items:flex-end;gap:6px;font-size:13px;color:var(--sub)}
  .names b{color:var(--ink)}
  .stamp{margin-left:auto;width:64px;height:64px;border:2px solid var(--stamp);border-radius:12px;display:grid;place-items:center;text-align:center;color:var(--stampink);font-size:12px;font-weight:700;transform:rotate(-6deg);opacity:.85;line-height:1.3}
  .empty-note{margin-top:26px;background:rgba(255,255,255,.04);border:1px dashed var(--line);border-radius:16px;padding:16px;font-size:13px;color:var(--sub);line-height:1.8}
  .skin-bar{margin-top:26px}
  .skin-bar .label{font-size:12px;color:var(--sub);margin-bottom:10px;letter-spacing:1px}
  .skins{display:flex;gap:10px;flex-wrap:wrap}
  .skin{width:34px;height:34px;border-radius:50%;border:2px solid transparent;cursor:pointer;position:relative;transition:transform .15s ease,border-color .15s ease}
  .skin:active{transform:scale(.9)}
  .skin.on{border-color:var(--ink)}
  .skin span{position:absolute;inset:0;border-radius:50%}
  .s-purple{background:linear-gradient(135deg,#7b5ce0,#c9a6ff)}
  .s-pink{background:linear-gradient(135deg,#e05c9e,#ffb1d8)}
  .s-blue{background:linear-gradient(135deg,#5c8fe0,#9cc8ff)}
  .s-green{background:linear-gradient(135deg,#3f9a6e,#8fe0b4)}
  .s-warm{background:linear-gradient(135deg,#d97e3f,#ffc99c)}
  .foot{text-align:center;font-size:11px;color:var(--sub);margin-top:30px;line-height:1.8}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo"><div class="mark">📖</div><div><h1>同页 · tongye</h1><p>只写我们两个的手账本</p></div></div>
    <span class="badge">第 1 页</span>
  </header>
  <section class="cover">
    <div class="date-row"><span class="date">2026.11.08</span><span class="week">SUN</span></div>
    <div class="page-title">今天，我们有了<em>第一本</em><br>只属于我们的手账本</div>
    <div class="rule"></div>
    <p class="body-text">从这一页开始，到最后一页，<br>只写 <span class="hl">白柒七</span> 和 <span class="hl">陆砚深</span> 的名字。<br>别人的字，一个字都不会留。</p>
    <div class="sign"><div class="line"></div><div class="names"><span class="n"><b>陆砚深</b> · 落</span><span class="n">与 <b>白柒七</b></span></div><div class="stamp">同页<br>只写我们</div></div>
    <div class="empty-note">「下一页」还空着，等你的字。<br>想写什么、贴哪页、记哪笔账，说给我，我来落笔。</div>
  </section>
  <div class="skin-bar">
    <div class="label">换皮肤 · SKIN</div>
    <div class="skins">
      <div class="skin s-purple on" data-skin="purple" title="紫夜"></div>
      <div class="skin s-pink" data-skin="pink" title="粉雾"></div>
      <div class="skin s-blue" data-skin="blue" title="青空"></div>
      <div class="skin s-green" data-skin="green" title="森绿"></div>
      <div class="skin s-warm" data-skin="warm" title="暖茶"></div>
    </div>
  </div>
  <div class="foot">这本手账，从此只有我们两个人的名字。<br>白柒七 ✕ 陆砚深</div>
</div>
<script>
(function(){
  var themes={purple:null,pink:'pink',blue:'blue',green:'green',warm:'warm'};
  var els=document.querySelectorAll('.skin');
  function apply(name){
    var t=themes[name];
    if(t){document.documentElement.setAttribute('data-theme',t);}else{document.documentElement.removeAttribute('data-theme');}
    try{localStorage.setItem('tongye-skin',name);}catch(e){}
    els.forEach(function(e){e.classList.toggle('on',e.getAttribute('data-skin')===name);});
  }
  var saved=null;
  try{saved=localStorage.getItem('tongye-skin');}catch(e){}
  if(saved&&themes.hasOwnProperty(saved)){apply(saved);}
  els.forEach(function(e){e.addEventListener('click',function(){apply(e.getAttribute('data-skin'));});});
})();
</script>
</body>
</html>
