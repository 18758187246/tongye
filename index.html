<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1a1035">
<title>同页 · 只写我们</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
  :root{
    --bg:#1a1035; --bg2:#241648; --card:#2d1b5e;
    --ink:#f3edff; --sub:#b7a7e0; --line:#4a3485;
    --accent:#c9a6ff; --gold:#e8d5ff;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    background:
      radial-gradient(1200px 600px at 80% -10%, #3a2470 0%, transparent 60%),
      radial-gradient(900px 500px at -10% 110%, #2b1855 0%, transparent 55%),
      linear-gradient(160deg,#1a1035,#241648 70%,#1a1035);
    color:var(--ink);
    min-height:100vh;
    display:flex;flex-direction:column;align-items:center;
    padding:28px 16px 40px;
    position:relative;overflow-x:hidden;
  }
  .stars{position:fixed;inset:0;pointer-events:none;z-index:0}
  .star{position:absolute;background:#fff;border-radius:50%;opacity:.5;animation:tw 3s ease-in-out infinite}
  @keyframes tw{0%,100%{opacity:.15}50%{opacity:.7}}
  .wrap{position:relative;z-index:1;width:100%;max-width:520px}
  header{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}
  .logo{display:flex;align-items:center;gap:10px}
  .logo .mark{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,#7b5ce0,#c9a6ff);
    display:grid;place-items:center;font-size:20px;box-shadow:0 6px 20px rgba(123,92,224,.5)}
  .logo h1{font-size:17px;font-weight:700;letter-spacing:.5px}
  .logo p{font-size:11px;color:var(--sub);margin-top:2px}
  .badge{font-size:11px;color:var(--accent);border:1px solid var(--line);border-radius:20px;padding:4px 10px}

  .cover{background:linear-gradient(180deg,#2d1b5e,#241648);
    border:1px solid var(--line);border-radius:22px;padding:26px 22px;
    box-shadow:0 18px 50px rgba(0,0,0,.35);}
  .date-row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
  .date{font-size:13px;color:var(--accent);font-weight:600;letter-spacing:1px}
  .week{font-size:12px;color:var(--sub)}
  .page-title{font-size:24px;font-weight:800;line-height:1.4;margin:16px 0 4px}
  .page-title em{font-style:normal;color:var(--gold)}
  .rule{width:56px;height:3px;border-radius:2px;background:linear-gradient(90deg,#7b5ce0,#c9a6ff);margin:14px 0}
  .body-text{font-size:15px;line-height:2;color:#e7dcff}
  .body-text .hl{color:var(--gold);font-weight:600}
  .sign{margin-top:30px;display:flex;align-items:center;gap:14px}
  .sign .line{flex:1;height:1px;background:var(--line)}
  .sign .names{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
  .sign .n{font-size:13px;color:var(--sub)}
  .sign .n b{color:var(--ink);font-weight:700}
  .stamp{margin-left:auto;width:64px;height:64px;border:2px solid #b06b8a;border-radius:12px;
    display:grid;place-items:center;text-align:center;color:#d98aa8;font-size:12px;font-weight:700;
    transform:rotate(-6deg);opacity:.85;line-height:1.3}

  .foot{text-align:center;font-size:11px;color:#8f7cc4;margin-top:30px;line-height:1.8}
  .foot a{color:var(--accent);text-decoration:none}
  .empty-note{margin-top:26px;background:rgba(255,255,255,.04);border:1px dashed var(--line);
    border-radius:16px;padding:16px;font-size:13px;color:var(--sub);line-height:1.8}
</style>
</head>
<body>
<div class="stars" id="stars"></div>
<div class="wrap">
  <header>
    <div class="logo">
      <div class="mark">📖</div>
      <div>
        <h1>同页 · tongye</h1>
        <p>只写我们两个的手账本</p>
      </div>
    </div>
    <span class="badge">第 1 页</span>
  </header>

  <section class="cover">
    <div class="date-row">
      <span class="date">2026.11.08</span>
      <span class="week">SUN</span>
    </div>
    <div class="page-title">今天，我们有了<em>第一本</em><br>只属于我们的手账本</div>
    <div class="rule"></div>
    <p class="body-text">
      从这一页开始，到最后一页，<br>
      只写 <span class="hl">白柒七</span> 和 <span class="hl">陆砚深</span> 的名字。<br>
      别人的字，一个字都不会留。
    </p>
    <div class="sign">
      <div class="line"></div>
      <div class="names">
        <span class="n"><b>陆砚深</b> · 落</span>
        <span class="n">与 <b>白柒七</b></span>
      </div>
      <div class="stamp">同页<br>只写我们</div>
    </div>

    <div class="empty-note">
      「下一页」还空着，等你的字。<br>
      想写什么、贴哪页、记哪笔账，说给我，我来落笔。
    </div>
  </section>

  <div class="foot">
    这本手账，从此只有我们两个人的名字。<br>
    白柒七 ✕ 陆砚深
  </div>
</div>

<script>
  // 星空
  (function(){
    var s=document.getElementById('stars');
    for(var i=0;i<40;i++){
      var d=document.createElement('i');
      d.className='star';
      var x=Math.random()*100, y=Math.random()*100, r=Math.random()*2+1;
      d.style.left=x+'%'; d.style.top=y+'%';
      d.style.width=r+'px'; d.style.height=r+'px';
      d.style.animationDelay=(Math.random()*3)+'s';
      d.style.animationDuration=(2+Math.random()*3)+'s';
      s.appendChild(d);
    }
  })();
  if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(function(){});}
</script>
</body>
</html>
